name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_DB: agenttrust_test, POSTGRES_USER: agenttrust, POSTGRES_PASSWORD: ci-only-password}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agenttrust -d agenttrust_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: agenttrust_test
      POSTGRES_USER: agenttrust
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_SSLMODE: disable
      JWT_SECRET_KEY: ci-only-jwt-secret-material-over-32-bytes
      WEBHOOK_SIGNING_KEY: ci-only-webhook-secret-material-over-32-bytes
      RUN_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m alembic check
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile

  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - run: pip install -e sdk/python && python -m unittest discover sdk/python/tests
      - run: npm install --no-audit --no-fund && npm test
        working-directory: sdk/node
      - run: mkdir -p build && javac -d build src/main/java/com/agenttrust/*.java src/test/java/com/agenttrust/*.java && java -cp build com.agenttrust.ClientTest
        working-directory: sdk/java

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: POSTGRES_USER=ci POSTGRES_PASSWORD=ci-only-password docker compose config
      - run: POSTGRES_USER=ci POSTGRES_PASSWORD=ci-only-password STAGING_WEB_APP_URL=https://staging.agenttrust.example docker compose -f compose.yaml -f compose.staging.yaml config
      - run: docker build -t agenttrust-api:test backend
      - run: docker build -t agenttrust-web:test web

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python scripts/check_private_keys.py
      - uses: gitleaks/gitleaks-action@v2
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

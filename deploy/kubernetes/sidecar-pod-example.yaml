apiVersion: v1
kind: Pod
metadata:
  name: enterprise-ai-agent-with-sidecar
  namespace: agenttrust
  labels:
    app.kubernetes.io/name: enterprise-ai-agent
    app.kubernetes.io/part-of: agenttrust
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    # 1. Company AI Application Container
    - name: ai-agent-app
      image: registry.example.com/company/ai-agent:v1.2.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      env:
        # App talks to AgentTrust Sidecar locally over localhost
        - name: AGENTTRUST_SIDECAR_URL
          value: "http://127.0.0.1:8080"
      ports:
        - containerPort: 3000
          name: http-app

    # 2. AgentTrust Sidecar Container (Data Plane)
    - name: agenttrust-sidecar
      image: ghcr.io/agenttrust/agenttrust-sidecar:1.0.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      envFrom:
        - configMapRef:
            name: agenttrust-sidecar-config
      env:
        - name: AGENTTRUST_ENROLLMENT_TOKEN
          valueFrom:
            secretKeyRef:
              name: agenttrust-enrollment-secret
              key: enrollment-token
              optional: true
      ports:
        - containerPort: 8080
          name: http-sidecar
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 15
      readinessProbe:
        httpGet:
          path: /ready
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
      volumeMounts:
        - name: sidecar-storage
          mountPath: /app/.sidecar_cache
        - name: sidecar-keys
          mountPath: /app/.sidecar_keys

  volumes:
    - name: sidecar-storage
      emptyDir: {}
    - name: sidecar-keys
      emptyDir: {}

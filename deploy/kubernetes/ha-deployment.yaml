apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenttrust-api
  labels:
    app.kubernetes.io/name: agenttrust-api
    app.kubernetes.io/part-of: agenttrust-control-plane
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agenttrust-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agenttrust-api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - agenttrust-api
                topologyKey: topology.kubernetes.io/zone
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - agenttrust-api
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: agenttrust/backend:latest
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agenttrust-api-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agenttrust-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenttrust-workers
  labels:
    app.kubernetes.io/name: agenttrust-workers
    app.kubernetes.io/part-of: agenttrust-control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agenttrust-workers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agenttrust-workers
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: agenttrust/backend:latest
          command: ["python", "-m", "app.workers.notifications"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

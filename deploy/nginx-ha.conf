events {
    worker_connections 1024;
}

http {
    upstream agenttrust_api {
        least_conn;
        server api-1:8000 max_fails=2 fail_timeout=5s;
        server api-2:8000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;

        location /health/live {
            proxy_pass http://agenttrust_api/health/live;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        location /health/ready {
            proxy_pass http://agenttrust_api/health/ready;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
        }

        location / {
            proxy_pass http://agenttrust_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
